[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gridfoil"
dynamic = ["version"]
readme = "README.md"
description = "Pure Python structured mesh generation for two-dimensional airfoils"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["airfoil", "mesh", "CFD", "SU2", "CGNS", "Fluent", "STAR-CCM+"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "h5py>=3.10",
    "numpy>=1.26",
    "scikit-optimize>=0.10",
    "scipy>=1.12",
]

[project.urls]
Repository = "https://github.com/Jun-AE/GridFoil"
Issues = "https://github.com/Jun-AE/GridFoil/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.12",
    "twine>=5.0",
]

[project.scripts]
gridfoil = "gridfoil.cli:main"

[tool.setuptools]
packages = ["gridfoil"]
include-package-data = false

[tool.setuptools.package-dir]
gridfoil = "src"

[tool.setuptools.dynamic]
version = {attr = "gridfoil.__version__"}

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gridfoil"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
